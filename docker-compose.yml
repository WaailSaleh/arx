services:
  palworld-server:
    # https://github.com/pocketpairjp/palserver
    image: ghcr.io/pocketpairjp/palserver:latest

    entrypoint: /pal/helper.sh

    # https://tech.palworldgame.com/settings-and-operation/arguments
    command:
      - -port=8211
      - -useperfthreads
      - -NoAsyncLoadingThread
      - -UseMultithreadForDS
      - -servername="Blesse"
      - -serverpassword="shonda"
      - -publiclobby

    ports:
      - "8211:8211/udp"

    volumes:
      - ./helper.sh:/pal/helper.sh
      - saved:/pal/Package/Pal/Saved

    labels:
      - com.docker.compose.service=palworld-server

  uploader:
    build:
      context: ./uploader
    environment:
      - SAVES_DIR=/data
      - DOCKER_LABEL_SERVICE=palworld-server
    volumes:
      - saved:/data
      # Optional: to allow container to restart palworld directly
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"

volumes:
  saved:
    driver: local